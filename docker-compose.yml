services:
  traceability:
    build: .
    image: measurement-traceability:latest
    container_name: measurement-traceability
    ports:
      - "8080:8080"
    environment:
      # 容器内 SQLite 路径（数据卷挂载点）
      TRACE_DB_PATH: /data/trace.db
      TRACE_HOST: 0.0.0.0
      TRACE_PORT: "8080"
      TRACE_BUSY_TIMEOUT_MS: "5000"
      TRACE_MAX_PAGE_SIZE: "200"
    volumes:
      # 数据库文件持久化到命名卷；删除容器不丢数据
      - trace-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  trace-data:
